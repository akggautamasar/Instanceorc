name: Oracle A1 capacity retry
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-yct-driver
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_STACK_OCID: ${{ secrets.OCI_STACK_OCID }}
      OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
      OCI_REGION: ap-mumbai-1
      OCI_INSTANCE_NAME: ${{ vars.OCI_INSTANCE_NAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration
        shell: bash
        run: |
          for name in OCI_TENANCY_OCID OCI_USER_OCID OCI_FINGERPRINT OCI_PRIVATE_KEY OCI_STACK_OCID OCI_COMPARTMENT_OCID OCI_INSTANCE_NAME; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing $name"; exit 1; fi
          done
      - name: Install OCI SDK
        run: python -m pip install 'oci>=2.130,<3'
      - name: Check instance and retry capacity failures
        run: python scripts/retry_oci.py
